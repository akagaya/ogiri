    <path d="M50 12 l1.5 3 l3 1.5 l-3 1.5 l-1.5 3 l-1.5-3 l-3-1.5 l3-1.5z"/>
    <path d="M54 22 l1 2 l2 1 l-2 1 l-1 2 l-1-2 l-2-1 l2-1z" opacity="0.6"/>
