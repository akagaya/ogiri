services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "8787:8787"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://api:8787
    depends_on:
      - api
    restart: unless-stopped
